      { icon:"🧠", name:"Deep Learning Recognition", desc:"بيتحسن بمرور الوقت، يتكيف مع تغييرات الوجه زي النظارات أو الشعر أو الشيخوخة بدون إعادة تسجيل", tag:"tag-detect", label:"Detection" }
    ]}
  ]
};

const cats = Object.keys(data);
let active = cats[0];

const tabs = document.getElementById('tabs');
const grid = document.getElementById('grid');

cats.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (cat === active ? ' active' : '');
  btn.textContent = cat;
  btn.onclick = () => {
    active = cat;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };
  tabs.appendChild(btn);
});

function render() {
  const tools = data[active];
  grid.innerHTML = '';
  tools.forEach(tool => {
    const card = document.createElement('div');
    card.className = 'tool-card' + (tool.limited ? ' limited' : '');
    card.innerHTML = `
      <div class="tool-header">
        <span class="tool-rank">${tool.rank}</span>
        <div>
          <div class="tool-name">${tool.name}</div>
          <div class="tool-sub">${tool.sub}</div>
        </div>
      </div>
      <div class="ai-list">
        ${tool.features.map(f => `
          <div class="ai-feature">
            <div class="ai-icon">${f.icon}</div>
            <div class="ai-text">
              <div class="ai-name">${f.name}</div>
              <div class="ai-desc">${f.desc}</div>
              <span class="ai-tag ${f.tag}">${f.label}</span>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    grid.appendChild(card);
  });
}

render();
</script>
